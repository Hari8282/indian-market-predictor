<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indian Market Trading Dashboard</title>
<script src="https://unpkg.com/lightweight-charts@5.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{color-scheme:dark;font-family:Inter,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e5eefb}
header{padding:14px 18px;border-bottom:1px solid #1d2b40;display:flex;gap:14px;align-items:center;justify-content:space-between;position:sticky;top:0;background:#07111f;z-index:5}
h1{font-size:18px;margin:0}.wrap{max-width:1450px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0d1929;border:1px solid #1d2b40;border-radius:12px;padding:14px}.label{color:#8fa3bf;font-size:12px}.value{font-size:22px;font-weight:700;margin-top:5px}.green{color:#43d17a}.red{color:#ff6b6b}.yellow{color:#ffd166}
#status{font-size:12px;padding:7px 10px;border-radius:20px;background:#17263a}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.controls button{background:#14243a;color:#dce8f8;border:1px solid #2a405d;border-radius:8px;padding:8px 12px;cursor:pointer}.controls button.active{background:#2563eb}.controls input{min-width:330px;flex:1;background:#0b1523;color:#fff;border:1px solid #2a405d;border-radius:8px;padding:8px}
.chart-card{padding:0;overflow:hidden}.chart-head{padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #1d2b40}.chart{height:560px;width:100%}.analysis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#9fb2cc}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.analysis{grid-template-columns:1fr}.chart{height:440px}header{position:static}.controls input{min-width:100%}}
</style>
</head>
<body>
<header><h1>📊 Market Hub — Indian Markets</h1><span id="status">Connecting…</span></header>
<div class="wrap">
<div class="controls">
<input id="api" placeholder="https://YOUR-SERVICE.onrender.com" value="">
<button onclick="saveAndLoad()">Connect / Refresh</button>
</div>
<div class="grid">
<div class="card"><div class="label">NIFTY 50</div><div id="niftyPrice" class="value">--</div></div>
<div class="card"><div class="label">BANK NIFTY</div><div id="bankPrice" class="value">--</div></div>
<div class="card"><div class="label">MARKET PREDICTION</div><div id="prediction" class="value">--</div><div id="confidence" class="label">Confidence: --</div></div>
<div class="card"><div class="label">CPR</div><div id="cpr" class="value" style="font-size:14px">Loading…</div></div>
</div>

<div class="controls">
<button id="niftyBtn" class="active" onclick="selectMarket('nifty')">Nifty 50</button>
<button id="bankBtn" onclick="selectMarket('bank')">Bank Nifty</button>
<button data-tf="1m">1M</button><button data-tf="5m">5M</button><button data-tf="15m" class="active">15M</button>
<button data-tf="30m">30M</button><button data-tf="1h">1H</button><button data-tf="1d">1D</button>
</div>

<div class="card chart-card"><div class="chart-head"><b id="title">Nifty 50 • Market Structure</b><span id="chartStatus">Waiting…</span></div><div id="chart" class="chart"></div></div>
<div class="analysis">
<div class="card"><b>Trade Signal</b><pre id="signal">--</pre></div>
<div class="card"><b>Support / Resistance</b><pre id="sr">--</pre></div>
<div class="card"><b>HH / HL / LH / LL</b><pre id="structure">--</pre></div>
</div>
<div class="card" style="margin-top:12px"><b>Debug / API response</b><pre id="debug">Not loaded</pre></div>
</div>

<script>
let apiBase=localStorage.getItem('marketApi')||'';
let timeframe='15m', marketKey='nifty', chart, candleSeries, volumeSeries, ro, payload;

document.getElementById('api').value=apiBase;
document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{timeframe=b.dataset.tf;document.querySelectorAll('[data-tf]').forEach(x=>x.classList.remove('active'));b.classList.add('active');load();});

function status(ok,msg){const e=document.getElementById('status');e.textContent=msg;e.style.color=ok?'#43d17a':'#ff6b6b'}
function num(v){const n=Number(v);return Number.isFinite(n)?n:null}
function timeOf(v){if(typeof v==='number')return v>1e11?Math.floor(v/1000):Math.floor(v);if(typeof v==='string'){if(/^\d+(\.\d+)?$/.test(v)){let n=Number(v);return n>1e11?Math.floor(n/1000):Math.floor(n)}let n=Date.parse(v);if(Number.isFinite(n))return Math.floor(n/1000)}return null}
function candles(m){
 const raw=m?.candleData||m?.candles||m?.candlestickData||m?.chartData||m?.ohlcv||[];
 if(!Array.isArray(raw))return [];
 const seen=new Set();
 return raw.map(x=>Array.isArray(x)?{time:timeOf(x[0]),open:num(x[1]),high:num(x[2]),low:num(x[3]),close:num(x[4]),volume:num(x[5])||0}:{time:timeOf(x.time??x.timestamp??x.datetime??x.date),open:num(x.open??x.Open),high:num(x.high??x.High),low:num(x.low??x.Low),close:num(x.close??x.Close),volume:num(x.volume??x.Volume)??0})
 .filter(x=>x.time&&x.open!==null&&x.high!==null&&x.low!==null&&x.close!==null&&!seen.has(x.time)&&(seen.add(x.time),true)).sort((a,b)=>a.time-b.time)
}
function initChart(){
 const el=document.getElementById('chart');
 if(!window.LightweightCharts)throw Error('Chart library failed to load');
 if(chart){chart.remove();if(ro)ro.disconnect()}
 chart=LightweightCharts.createChart(el,{width:Math.max(320,el.clientWidth),height:Math.max(400,el.clientHeight),layout:{background:{type:'solid',color:'#0d1929'},textColor:'#b7c7dd'},grid:{vertLines:{color:'#17263a'},horzLines:{color:'#17263a'}},timeScale:{timeVisible:true}});
 candleSeries=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#43d17a',downColor:'#ff6b6b',borderVisible:false,wickUpColor:'#43d17a',wickDownColor:'#ff6b6b'});
 volumeSeries=chart.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'volume'});
 volumeSeries.priceScale().applyOptions({scaleMargins:{top:.8,bottom:0}});
 ro=new ResizeObserver(()=>chart&&chart.applyOptions({width:el.clientWidth,height:el.clientHeight}));ro.observe(el);
}
function line(name,value,color){value=num(value);if(value!==null)candleSeries.createPriceLine({price:value,color,lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true,title:name})}
function render(){
 const m=marketKey==='bank'?(payload.bankNifty||payload.banknifty):(payload.nifty||payload.bankNifty||payload.banknifty);
 const cs=candles(m);
 document.getElementById('debug').textContent=JSON.stringify({market:marketKey,keys:Object.keys(m||{}),rawCandles:(m?.candleData||m?.candles||[]).length,validCandles:cs.length},null,2);
 if(!cs.length)throw Error('API returned no valid candles. Check Debug / API response.');
 initChart();candleSeries.setData(cs.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));
 volumeSeries.setData(cs.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(67,209,122,.35)':'rgba(255,107,107,.35)'})));
 const o=m.chartOverlays||{}, c=m.cpr||{};
 (o.cpr||[{name:'BC',value:c.bc},{name:'PIVOT',value:c.pivot},{name:'TC',value:c.tc}]).forEach(x=>line(x.name||'CPR',x.value??x.price,'#38bdf8'));
 (o.support||m.support||[]).forEach((x,i)=>line('S'+(i+1),typeof x==='object'?(x.value??x.price??x.level):x,'#43d17a'));
 (o.resistance||m.resistance||[]).forEach((x,i)=>line('R'+(i+1),typeof x==='object'?(x.value??x.price??x.level):x,'#ff6b6b'));
 const st=o.structureMarkers||m.marketStructure?.structure||[], valid=new Set(cs.map(x=>x.time));
 const marks=st.map(x=>{let t=timeOf(x.time??x.timestamp??x.datetime??x.date),type=x.type||x.label||'';return {time:t,position:(type==='HH'||type==='LH')?'aboveBar':'belowBar',color:(type==='HH'||type==='HL')?'#43d17a':'#ff6b6b',shape:(type==='HH'||type==='HL')?'arrowUp':'arrowDown',text:type}}).filter(x=>valid.has(x.time));
 if(marks.length&&LightweightCharts.createSeriesMarkers)LightweightCharts.createSeriesMarkers(candleSeries,marks);
 chart.timeScale().fitContent();
 document.getElementById('title').textContent=(marketKey==='bank'?'Bank Nifty':'Nifty 50')+' • '+cs.length+' Candles';
 document.getElementById('chartStatus').textContent='LIVE • '+cs.length+' candles';
 document.getElementById('signal').textContent=JSON.stringify(m.tradeSignal||{},null,2);
 document.getElementById('sr').textContent=JSON.stringify({support:o.support||m.support||[],resistance:o.resistance||m.resistance||[],cpr:c},null,2);
 document.getElementById('structure').textContent=JSON.stringify(m.marketStructure||{},null,2);
}
function updateCards(){
 const n=payload.nifty||{},b=payload.bankNifty||payload.banknifty||{};
 const price=x=>x.currentPrice??x.price??x.lastPrice??x.close??'--';
 document.getElementById('niftyPrice').textContent=price(n);document.getElementById('bankPrice').textContent=price(b);
 const m=marketKey==='bank'?b:n, s=m.tradeSignal||{}, p=payload.prediction||m.prediction||{};
 document.getElementById('prediction').textContent=s.signal||p.direction||p.signal||'HOLD';
 document.getElementById('confidence').textContent='Confidence: '+(s.confidence??p.confidence??'--');
 const c=m.cpr||{};document.getElementById('cpr').textContent='BC '+(c.bc??'--')+' | P '+(c.pivot??'--')+' | TC '+(c.tc??'--');
}
async function load(){
 const base=apiBase.replace(/\/$/,'');if(!base){status(false,'Enter Render backend URL');return}
 status(false,'Loading…');document.getElementById('chartStatus').textContent='Loading '+timeframe+'…';
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),25000);
 try{
   const r=await fetch(base+'/api/market-data?timeframe='+encodeURIComponent(timeframe)+'&_='+Date.now(),{headers:{Accept:'application/json'},cache:'no-store',signal:ctrl.signal});
   const text=await r.text();let json;try{json=JSON.parse(text)}catch{throw Error('Backend did not return JSON: HTTP '+r.status)}
   if(!r.ok)throw Error(json.error||json.message||'HTTP '+r.status);
   payload=json.data||json; window.payload=payload;
   updateCards();render();status(true,'● Backend Connected');
 }catch(e){console.error(e);status(false,'Offline: '+e.message);document.getElementById('chartStatus').textContent='Error: '+e.message}
 finally{clearTimeout(timer)}
}
function saveAndLoad(){apiBase=document.getElementById('api').value.trim();localStorage.setItem('marketApi',apiBase);load()}
function selectMarket(k){marketKey=k;document.getElementById('niftyBtn').classList.toggle('active',k==='nifty');document.getElementById('bankBtn').classList.toggle('active',k==='bank');if(payload){try{updateCards();render()}catch(e){console.error(e);document.getElementById('chartStatus').textContent=e.message}}}
if(apiBase)load();else status(false,'Enter Render backend URL');
</script>
</body></html>
